# Builds the site with Jekyll 4 and publishes it to GitHub Pages.
# Every push is built, so a branch can be checked before it is merged; only `main` is published.
# Needs: repo Settings > Pages > Source = "GitHub Actions".
name: Build and publish site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Forms must have an access key before publishing
        if: github.ref == 'refs/heads/main'
        run: |
          if grep -q 'name="access_key" value=""' _site/pilot/index.html _site/contact/index.html; then
            echo "::error::_data/forms.yml has no access_key, so the pilot and contact forms would not work."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
