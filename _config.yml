baseurl: '/'
permalink: pretty
title: 'Biclever: an AI agent and tools for SAP BusinessObjects'
url: 'https://biclever.com'


collections:
  products:
    output: true
    sort_by: weight
  pages:
    output: true

defaults:
  - scope:
      path: ""
      type: "products"
    values:
      layout: "product"
      section: "tools"
  - scope:
      path: "_pages"
    values:
      layout: "page"
      section: "tools"

sass:
  style: compressed # possible values: nested expanded compact compressed

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Old addresses are kept working with `redirect_from` in the target page's front matter.
redirect_from:
  json: false

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
  - CLAUDE.md
  - WEBSITE-INPUT.md
  - WEBSITE-INPUT-ROUND2.md
  - TODO.md
